openapi: 3.0.0
info:
  title: Simplified Library Management API
  version: 1.0.0
  description: A clean, direct API for library management designed for Week 7.

servers:
  - url: http://localhost:8080/api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Model for POST/PUT requests (no ID)
    BookRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        author:
          type: string
        quantity:
          type: integer
          default: 1

    # Model for Server responses (includes ID)
    Book:
      allOf:
        - $ref: '#/components/schemas/BookRequest'
        - type: object
          properties:
            id:
              type: string
              example: "65f1a2b3c4d5e6f7g8h9i0"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

paths:
  /auth/login:
    post:
      summary: User Login
      operationId: openapi_server.controllers.auth_controller.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /books:
    get:
      summary: Get all books
      operationId: openapi_server.controllers.book_controller.get_books
      responses:
        '200':
          description: A list of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

    post:
      summary: Add a new book
      operationId: openapi_server.controllers.book_controller.create_book
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

  /books/{book_id}:
    parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Get book details
      operationId: openapi_server.controllers.book_controller.get_book_by_id
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found

    put:
      summary: Update a book
      operationId: openapi_server.controllers.book_controller.update_book
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '200':
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

    delete:
      summary: Remove a book
      operationId: openapi_server.controllers.book_controller.delete_book
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Book deleted successfully