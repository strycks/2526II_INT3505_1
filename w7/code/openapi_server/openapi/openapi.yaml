openapi: 3.0.1
info:
  title: Book Management API
  version: "1.0"
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: Authorization
  name: api/v1/auth
- description: Book Management
  name: api/v1/books
- description: User Management
  name: api/v1/users
paths:
  /api/v1/auth/login:
    post:
      operationId: post_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
        required: true
      responses:
        "200":
          content: {}
          description: Success
      security: []
      summary: Login to get JWT Token
      tags:
      - api/v1/auth
      x-codegen-request-body-name: payload
      x-openapi-router-controller: openapi_server.controllers.api_v1_auth_controller
  /api/v1/auth/refresh:
    post:
      operationId: post_refresh
      responses:
        "200":
          content: {}
          description: Success
      summary: Refresh token
      tags:
      - api/v1/auth
      x-openapi-router-controller: openapi_server.controllers.api_v1_auth_controller
  /api/v1/auth/register:
    post:
      operationId: post_register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
        required: true
      responses:
        "200":
          content: {}
          description: Success
      summary: Register an user
      tags:
      - api/v1/auth
      x-codegen-request-body-name: payload
      x-openapi-router-controller: openapi_server.controllers.api_v1_auth_controller
  /api/v1/books:
    get:
      operationId: get_book_list
      parameters:
      - description: Page number
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: Item per page
        in: query
        name: per_page
        schema:
          default: 10
          type: integer
      - description: Search query
        in: query
        name: q
        schema:
          type: string
      responses:
        "200":
          content: {}
          description: Success
      summary: Get all books
      tags:
      - api/v1/books
      x-openapi-router-controller: openapi_server.controllers.api_v1_books_controller
    post:
      operationId: post_book_list
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
        required: true
      responses:
        "201":
          content: {}
          description: Created
        "400":
          content: {}
          description: Bad Request
      summary: Add new book
      tags:
      - api/v1/books
      x-codegen-request-body-name: payload
      x-openapi-router-controller: openapi_server.controllers.api_v1_books_controller
  /api/v1/books/{book_id}:
    delete:
      operationId: delete_book_item
      parameters:
      - in: path
        name: book_id
        required: true
        schema:
          type: string
      responses:
        "204":
          content: {}
          description: Deleted
      summary: Delete a specific book
      tags:
      - api/v1/books
      x-openapi-router-controller: openapi_server.controllers.api_v1_books_controller
    get:
      operationId: get_book_item
      parameters:
      - in: path
        name: book_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content: {}
          description: Success
      summary: Get a specific book
      tags:
      - api/v1/books
      x-openapi-router-controller: openapi_server.controllers.api_v1_books_controller
  /api/v1/users:
    get:
      operationId: get_user_list
      parameters:
      - description: After index
        in: query
        name: after
        schema:
          type: string
      - description: Item limit
        in: query
        name: limit
        schema:
          default: 10
          type: integer
      responses:
        "200":
          content: {}
          description: Success
      summary: Get all users
      tags:
      - api/v1/users
      x-openapi-router-controller: openapi_server.controllers.api_v1_users_controller
  /api/v1/users/{user_id}:
    get:
      operationId: get_user_entry
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content: {}
          description: Success
      summary: Get a specific user
      tags:
      - api/v1/users
      x-openapi-router-controller: openapi_server.controllers.api_v1_users_controller
  /api/v1/users/{user_id}/borrowings:
    get:
      operationId: get_user_borrows
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content: {}
          description: Success
      summary: View list of borrowed books
      tags:
      - api/v1/users
      x-openapi-router-controller: openapi_server.controllers.api_v1_users_controller
    post:
      operationId: post_user_borrows
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BorrowingRequest"
        required: true
      responses:
        "200":
          content: {}
          description: Success
      summary: Borrow a book
      tags:
      - api/v1/users
      x-codegen-request-body-name: payload
      x-openapi-router-controller: openapi_server.controllers.api_v1_users_controller
components:
  responses:
    ParseError:
      content: {}
      description: When a mask can't be parsed
    MaskError:
      content: {}
      description: When any error occurs on mask
    DoesNotExist:
      content: {}
      description: When resource doesn't exist
    ValidationError:
      content: {}
      description: When resource format isn't correct
  schemas:
    Login:
      example:
        password: "123456"
        username: admin
      properties:
        username:
          default: admin
          title: username
          type: string
        password:
          default: "123456"
          title: password
          type: string
      required:
      - password
      - username
      title: Login
      type: object
    Register:
      example:
        password: password
        role: role
        name: name
        username: username
      properties:
        username:
          title: username
          type: string
        password:
          title: password
          type: string
        name:
          title: name
          type: string
        role:
          title: role
          type: string
      required:
      - name
      - password
      - username
      title: Register
      type: object
    BookRequest:
      example:
        year: 0
        author: "valve, icefrog"
        title: title
      properties:
        title:
          title: title
          type: string
        author:
          default: "valve, icefrog"
          title: author
          type: string
        year:
          title: year
          type: integer
      required:
      - title
      title: BookRequest
      type: object
    BorrowingRequest:
      example:
        book_id: book_id
      properties:
        book_id:
          title: book_id
          type: string
      required:
      - book_id
      title: BorrowingRequest
      type: object
  securitySchemes:
    bearerAuth:
      in: header
      name: Authorization
      type: apiKey
      x-apikeyInfoFunc: openapi_server.controllers.security_controller.info_from_bearerAuth
x-original-swagger-version: "2.0"
