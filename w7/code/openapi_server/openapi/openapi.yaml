openapi: 3.0.0
info:
  description: "A clean, direct API for library management designed for Session 7.\
    \ No metadata wrapping."
  title: Simplified Library Management API
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
paths:
  /auth/login:
    post:
      operationId: openapi_server_controllers_auth_controller_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: Successfully authenticated
      summary: User Login
      x-openapi-router-controller: openapi_server.controllers.default_controller
  /books:
    get:
      operationId: openapi_server_controllers_book_controller_get_books
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Book"
                type: array
          description: A list of books
      summary: Get all books
      x-openapi-router-controller: openapi_server.controllers.default_controller
    post:
      operationId: openapi_server_controllers_book_controller_create_book
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
          description: Book created successfully
      security:
      - bearerAuth: []
      summary: Add a new book
      x-openapi-router-controller: openapi_server.controllers.default_controller
  /books/{book_id}:
    delete:
      operationId: openapi_server_controllers_book_controller_delete_book
      parameters:
      - explode: false
        in: path
        name: book_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Book deleted successfully
      security:
      - bearerAuth: []
      summary: Remove a book
      x-openapi-router-controller: openapi_server.controllers.default_controller
    get:
      operationId: openapi_server_controllers_book_controller_get_book_by_id
      parameters:
      - explode: false
        in: path
        name: book_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
          description: Book found
        "404":
          description: Book not found
      summary: Get book details
      x-openapi-router-controller: openapi_server.controllers.default_controller
    put:
      operationId: openapi_server_controllers_book_controller_update_book
      parameters:
      - explode: false
        in: path
        name: book_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
          description: Book updated successfully
      security:
      - bearerAuth: []
      summary: Update a book
      x-openapi-router-controller: openapi_server.controllers.default_controller
components:
  schemas:
    BookRequest:
      example:
        quantity: 0
        author: author
        title: title
      properties:
        title:
          title: title
          type: string
        author:
          title: author
          type: string
        quantity:
          default: 1
          title: quantity
          type: integer
      required:
      - title
      title: BookRequest
      type: object
    Book:
      allOf:
      - $ref: "#/components/schemas/BookRequest"
      - properties:
          id:
            example: 65f1a2b3c4d5e6f7g8h9i0
            type: string
        type: object
      example:
        quantity: 0
        author: author
        id: 65f1a2b3c4d5e6f7g8h9i0
        title: title
      title: Book
    LoginRequest:
      example:
        password: password
        username: username
      properties:
        username:
          title: username
          type: string
        password:
          title: password
          type: string
      required:
      - password
      - username
      title: LoginRequest
      type: object
    LoginResponse:
      example:
        access_token: access_token
        refresh_token: refresh_token
      properties:
        access_token:
          title: access_token
          type: string
        refresh_token:
          title: refresh_token
          type: string
      title: LoginResponse
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
      x-bearerInfoFunc: openapi_server.controllers.security_controller.info_from_bearerAuth
